<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vendor Authentication - MarketPlace</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#ffffff">
</head>

<body class="bg-gray-50 min-h-screen">
    <div class="container mx-auto px-4 py-8 max-w-md">
        <!-- Auth Container -->
        <div class="text-center mb-8">
            <div class="text-2xl font-bold text-blue-600 mb-4">MarketPlace</div>
        </div>

        <!-- Tab Navigation -->
        <div class="bg-white rounded-xl shadow-lg overflow-hidden">
            <div class="flex border-b">
                <button onclick="switchTab('login')" id="loginTab"
                    class="flex-1 px-4 py-4 text-center font-semibold text-blue-600 border-b-2 border-blue-600">
                    Login
                </button>
                <button onclick="switchTab('signup')" id="signupTab"
                    class="flex-1 px-4 py-4 text-center font-semibold text-gray-500">
                    Sign Up
                </button>
            </div>

            <!-- Login Form -->
            <div id="loginForm" class="p-6">
                <form onsubmit="handleLogin(event)" class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">Email</label>
                        <input type="email" required
                            class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">Password</label>
                        <input type="password" required
                            class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
                    </div>
                    <div class="flex items-center justify-between">
                        <label class="flex items-center">
                            <input type="checkbox" class="rounded border-gray-300 text-blue-600">
                            <span class="ml-2 text-sm text-gray-600">Remember me</span>
                        </label>
                        <a href="#" onclick="showResetPassword()" class="text-sm text-blue-600 hover:underline">
                            Forgot Password?
                        </a>
                    </div>
                    <button type="submit"
                        class="w-full py-3 px-4 bg-blue-600 text-white rounded-lg font-semibold hover:bg-blue-700 transition-colors">
                        Login
                    </button>
                </form>
            </div>

            <!-- Signup Form -->
            <div id="signupForm" class="p-6 hidden">
                <form onsubmit="handleSignup(event)" class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">Business Email</label>
                        <input type="email" required
                            class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">Business Name</label>
                        <input type="text" required
                            class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">Password</label>
                        <input type="password" required
                            class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">Confirm Password</label>
                        <input type="password" required
                            class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
                    </div>
                    <button type="submit"
                        class="w-full py-3 px-4 bg-blue-600 text-white rounded-lg font-semibold hover:bg-blue-700 transition-colors">
                        Create Account
                    </button>
                </form>
            </div>

            <!-- Password Reset Form -->
            <div id="resetForm" class="p-6 hidden">
                <button onclick="backToLogin()" class="mb-4 text-blue-600 hover:underline">&larr; Back to Login</button>
                <form onsubmit="handleReset(event)" class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">Email</label>
                        <input type="email" required
                            class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
                    </div>
                    <button type="submit"
                        class="w-full py-3 px-4 bg-blue-600 text-white rounded-lg font-semibold hover:bg-blue-700 transition-colors">
                        Reset Password
                    </button>
                </form>
            </div>
        </div>
    </div>

    <!-- Toast Notification -->
    <div id="toast"
        class="fixed bottom-4 right-4 bg-gray-800 text-white px-6 py-3 rounded-lg transform translate-y-full opacity-0 transition-all duration-300">
        <span id="toastMessage"></span>
    </div>

    <script>
        // Tab switching logic
        function switchTab(tab) {
            const loginTab = document.getElementById('loginTab');
            const signupTab = document.getElementById('signupTab');
            const loginForm = document.getElementById('loginForm');
            const signupForm = document.getElementById('signupForm');
            const resetForm = document.getElementById('resetForm');

            if (tab === 'login') {
                loginTab.classList.add('text-blue-600', 'border-b-2', 'border-blue-600');
                signupTab.classList.remove('text-blue-600', 'border-b-2', 'border-blue-600');
                loginForm.classList.remove('hidden');
                signupForm.classList.add('hidden');
                resetForm.classList.add('hidden');
            } else {
                signupTab.classList.add('text-blue-600', 'border-b-2', 'border-blue-600');
                loginTab.classList.remove('text-blue-600', 'border-b-2', 'border-blue-600');
                signupForm.classList.remove('hidden');
                loginForm.classList.add('hidden');
                resetForm.classList.add('hidden');
            }
        }

        // Show/hide password reset form
        function showResetPassword() {
            document.getElementById('loginForm').classList.add('hidden');
            document.getElementById('resetForm').classList.remove('hidden');
        }

        function backToLogin() {
            document.getElementById('resetForm').classList.add('hidden');
            document.getElementById('loginForm').classList.remove('hidden');
        }

        // Toast notification
        function showToast(message) {
            const toast = document.getElementById('toast');
            document.getElementById('toastMessage').textContent = message;
            toast.classList.remove('translate-y-full', 'opacity-0');
            setTimeout(() => {
                toast.classList.add('translate-y-full', 'opacity-0');
            }, 3000);
        }

        // Form handlers
        function handleLogin(event) {
            event.preventDefault();
            // Add your login logic here
            showToast('Login successful!');
            // Redirect to dashboard after successful login
            // window.location.href = '/dashboard';
        }

        function handleSignup(event) {
            event.preventDefault();
            // Add your signup logic here
            showToast('Account created successfully!');
            // Redirect to onboarding after successful signup
            // window.location.href = '/onboarding';
        }

        function handleReset(event) {
            event.preventDefault();
            // Add your password reset logic here
            showToast('Password reset link sent to your email!');
            backToLogin();
        }

        // Service Worker Registration
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.js')
                    .then(registration => {
                        console.log('ServiceWorker registered');
                    })
                    .catch(err => {
                        console.log('ServiceWorker registration failed', err);
                    });
            });
        }
    </script>
</body>

</html>
