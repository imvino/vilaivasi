<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vendor Onboarding - MarketPlace</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#ffffff">
</head>

<body class="bg-gray-50 min-h-screen">
    <div class="container mx-auto px-4 py-8 max-w-4xl">
        <!-- Header -->
        <header class="text-center mb-12">
            <div class="text-2xl md:text-3xl font-bold text-blue-600 mb-4">MarketPlace</div>
            <h1 class="text-2xl md:text-4xl font-bold text-gray-900 mb-2">Welcome to MarketPlace</h1>
            <p class="text-gray-600">Let's set up your vendor account in a few simple steps</p>
        </header>

        <!-- Main Content -->
        <main class="bg-white rounded-xl shadow-lg p-6 md:p-8">
            <!-- Progress Steps -->
            <div class="relative mb-12">
                <div class="absolute top-1/2 left-0 right-0 h-0.5 bg-gray-200 -translate-y-1/2"></div>
                <div class="relative flex justify-between">
                    <div
                        class="w-8 h-8 bg-blue-600 rounded-full flex items-center justify-center text-white font-semibold z-10">
                        1</div>
                    <div
                        class="w-8 h-8 bg-white border-2 border-gray-300 rounded-full flex items-center justify-center text-gray-500 font-semibold z-10">
                        2</div>
                    <div
                        class="w-8 h-8 bg-white border-2 border-gray-300 rounded-full flex items-center justify-center text-gray-500 font-semibold z-10">
                        3</div>
                    <div
                        class="w-8 h-8 bg-white border-2 border-gray-300 rounded-full flex items-center justify-center text-gray-500 font-semibold z-10">
                        4</div>
                </div>
            </div>

            <!-- Form -->
            <form class="space-y-6">
                <div>
                    <label for="business-name" class="block text-sm font-medium text-gray-700 mb-2">Business
                        Name</label>
                    <input type="text" id="business-name"
                        class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-colors"
                        placeholder="Enter your business name" required>
                </div>

                <div>
                    <label for="business-type" class="block text-sm font-medium text-gray-700 mb-2">Business
                        Type</label>
                    <select id="business-type"
                        class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-colors"
                        required>
                        <option value="">Select business type</option>
                        <option value="restaurant">Restaurant</option>
                        <option value="grocery">Grocery Store</option>
                        <option value="retail">Retail Shop</option>
                        <option value="services">Services</option>
                    </select>
                </div>

                <div>
                    <label for="business-address" class="block text-sm font-medium text-gray-700 mb-2">Business
                        Address</label>
                    <textarea id="business-address"
                        class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-colors"
                        rows="3" placeholder="Enter your business address"></textarea>
                </div>

                <div>
                    <label for="contact-number" class="block text-sm font-medium text-gray-700 mb-2">Contact
                        Number</label>
                    <input type="tel" id="contact-number"
                        class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-colors"
                        placeholder="Enter your contact number" required>
                </div>

                <!-- Buttons -->
                <div class="flex flex-col sm:flex-row justify-between gap-4 pt-6">
                    <button type="button"
                        class="order-2 sm:order-1 px-6 py-3 rounded-lg border-2 border-blue-600 text-blue-600 font-semibold hover:bg-blue-50 transition-colors">
                        Save as Draft
                    </button>
                    <button type="submit"
                        class="order-1 sm:order-2 px-6 py-3 rounded-lg bg-blue-600 text-white font-semibold hover:bg-blue-700 transition-colors">
                        Continue
                    </button>
                </div>
            </form>
        </main>
    </div>
</body>

</html>
